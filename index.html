<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两弹一星汇报用小游戏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { background:#0b1026; color:#e8e6df; font-family:"Microsoft YaHei","PingFang SC",sans-serif;

  #levelGrid { display:flex; gap:12px; margin:26px 0 10px; flex-wrap:wrap; justify-content:center; }

  .lv:hover:not(.lock) { border-color:#f0c869; transform:translateY(-3px); }
  .lv .yr { font-size:20px; color:#f0c869; font-weight:bold; }
  .lv .nm { font-size:12px; margin-top:6px; color:#cfd4ea; }
  .lv.lock { opacity:.35; cursor:not-allowed; }
  .lv.done .yr::after { content:" ✓"; color:#7dd87d; }
  #sciRow { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; justify-content:center; }
  .sci { width:160px; padding:10px; border:1px solid #3a4570; border-radius:8px;
         background:#11173a; font-size:12px; }
  .sci .sname { font-size:15px; color:#f0c869; margin-bottom:4px; }
  .sci.locked { filter:grayscale(1); opacity:.45; }
  .sci.locked .sname { color:#889; }

  .modalBox h2 { color:#f0c869; margin-bottom:12px; font-size:26px; }
  .modalBox p { color:#cfd4ea; line-height:1.8; font-size:15px; margin-bottom:8px; }

          border:1px solid #d66; border-radius:6px; cursor:pointer; }
  .mbtn.ghost { background:transparent; border-color:#556; color:#aab; margin-left:10px; }

  #toast { position:absolute; top:70px; left:50%; transform:translateX(-50%);

           pointer-events:none; transition:opacity .3s; }

  #ver { position:absolute; right:10px; bottom:6px; color:#445; font-size:11px; z-index:5; }

  #homeBtns { display:flex; flex-direction:column; gap:16px; margin-top:44px; align-items:center; }

  .hbtn.danger { border-color:#8a2b2b; color:#ff9b9b; }
  .hbtn.danger:hover { background:#8a2b2b; color:#fff; border-color:#d66; }
  .vtitle { color:#f0c869; font-size:26px; letter-spacing:6px; margin-bottom:20px; }
  .backBtn { margin-top:24px; }
  .sci .quote { color:#9fd08a; font-style:italic; margin:6px 0; font-size:11px; }
  #setBox { display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="group"><span id="hudLevel">—</span><span id="hudWind" style="color:#9aa3c7"></span></div>
    <div class="group" id="warheads"></div>
    <div class="group"><span id="hudShots"></span>

      <button class="wbtn" id="btnRestart">重开本关</button>
      <button class="wbtn" id="btnMenu">返回首页</button></div>
  </div>
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="toast" class="hidden"></div>
  <div id="ver">build v14</div>

  <!-- 首页 + 子页面 -->
  <div class="overlay" id="menu">
    <!-- 首页 -->
    <div id="viewHome">
      <h1>两弹一星</h1>
      <div class="sub">戈壁砺剑 · 星辰为证 —— 思政课汇报用小游戏 DEMO</div>
      <div id="homeBtns">
        <button class="hbtn" id="btnPlay">开始闯关</button>
        <button class="hbtn" id="btnSci">科学家图鉴</button>
        <button class="hbtn" id="btnSet">设置</button>
      </div>
      <div class="tip">操作：画面任意位置按住，向左下拖拽拉弓，松开发射 ｜ 飞行中按【空格】= 钱学森弹道 / 二级点火 ｜ 通关主线后解锁【无尽挑战】</div>
    </div>
    <!-- 关卡地图 -->
    <div id="viewLevels" class="hidden">
      <div class="vtitle">选择关卡</div>
      <div id="levelGrid"></div>
      <button class="mbtn ghost backBtn" data-back>返回首页</button>
    </div>
    <!-- 角色图鉴 -->
    <div id="viewSci" class="hidden">
      <div class="vtitle">科学家图鉴</div>
      <div id="sciRow"></div>
      <div class="tip">每归队一位科学家，发射架最大力度提升；科学家们还会带来新弹药、新能力与瞄准镜</div>
      <button class="mbtn ghost backBtn" data-back>返回首页</button>
    </div>
    <!-- 设置 -->
    <div id="viewSet" class="hidden">
      <div class="vtitle">设置</div>
      <div id="setBox">
        <button class="hbtn danger" id="btnReset">重置游戏数据</button>
        <div class="tip">将清空闯关进度与已归队的科学家，不可恢复</div>
      </div>
      <button class="mbtn ghost backBtn" data-back>返回首页</button>
    </div>
  </div>

  <!-- 关卡开场 / 结算 / 科学家解锁 弹窗 -->
  <div class="overlay hidden" id="modal">
    <div class="modalBox" id="modalBox"></div>
  </div>
</div>

  intro:'1982年10月12日，巨浪一号潜地导弹水下发射成功——共和国拥有了可靠的第二次核打击力量。<br>解锁<span style="color:#7ec8e3">【潜射阵地】</span>：点击HUD【阵地】按钮切换，潜艇悄然抵近目标中间，可向<span style="color:#7ec8e3">左右两个方向</span>出水点火！但<span style="color:#7ec8e3">出水初速较低（力度-28%）</span>，适合近距离精准打击。',

];

const WARHEAD_INFO={
 normal:{name:'常规',r:62,dmg:2,color:'#d8d8d8'},
 atomic:{name:'原子弹',r:135,dmg:2,color:'#ffd27b'},
 hydro:{name:'氢弹',r:290,dmg:3,color:'#ffb3ff'},
 bunker:{name:'钻地弹',r:95,dmg:3,color:'#c9a86a'},

/* ================= 状态 ================= */

/* ================= 关卡 ================= */
function startLevel(){
  hideModal();state='play';
  endless=false;useSub=false;stage2Used=false;
  $('btnSite').classList.toggle('hidden',!subAvail());
  $('btnSite').textContent='阵地：陆基';

  particles=[];missile=null;aiming=false;
  warheads={...lv.warheads};selWarhead='normal';
  deployMode=false;devices=[];
  glideUsed=false;glideT=0;shieldUsed=false;destroyedThisShot=0;
  demo=(lvIdx===0)?{t:0,flying:false,x:0,y:0,vx:0,vy:0,trail:[]}:null;   // 第一关播放操作演示
  const rw=SCIENTISTS.find(s=>s.after===lvIdx+1);

  renderWarheads();updateShots();

function warheadLocked(k){
  if(k==='atomic')return !hasSCI('atomic')&&lvIdx<5;   // 两弹结合(第6关)起解锁
  if(k==='hydro')return !hasSCI('yu')&&lvIdx<7;        // 氢弹关(第8关)起解锁
  if(k==='bunker')return !hasSCI('bunker')&&lvIdx<8;   // 地下核试验(第9关)起解锁
  return false;
}
function autoSelectWarhead(){
  if(!warheadLocked(selWarhead)&&(warheads[selWarhead]||0)>0)return;
  for(const k of ['normal','atomic','hydro','bunker']){
    if(!warheadLocked(k)&&(warheads[k]||0)>0){
      if(k!==selWarhead)toast(`「${WARHEAD_INFO[selWarhead].name}」弹药耗尽，自动切换：${WARHEAD_INFO[k].name}`);
      selWarhead=k;return;
    }
  }
}
function renderWarheads(){
  autoSelectWarhead();
  const w=$('warheads');w.innerHTML='<span style="color:#9aa3c7">弹头:</span>';
  for(const k of ['normal','atomic','hydro','bunker']){
    const n=warheads[k]||0;
    const b=document.createElement('button');
    const locked=warheadLocked(k);
    b.className='wbtn'+(selWarhead===k?' sel':'')+(n<=0||locked?' dis':'');
    b.textContent=`${WARHEAD_INFO[k].name}×${n}`;
    if(n>0&&!locked)b.onclick=()=>{selWarhead=k;renderWarheads();};
    w.appendChild(b);
  }
  // 定点试爆：部署 + 起爆
  if((warheads.deploy||0)>0){
    const locked=!hasSCI('deng')&&lvIdx<3;            // 罗布泊(第4关)起解锁
    const b=document.createElement('button');
    b.className='wbtn'+(deployMode?' sel':'')+(locked?' dis':'');
    b.textContent=`部署核装置×${warheads.deploy}`;
    if(!locked)b.onclick=()=>{deployMode=!deployMode;renderWarheads();};
    w.appendChild(b);
  }
  if(devices.length>0){
    const b=document.createElement('button');
    b.className='wbtn';b.style.borderColor='#f0c869';b.style.color='#f0c869';
    b.textContent='起爆！';b.onclick=detonateDevices;
    w.appendChild(b);
  }
}
function totalShots(){return warheads.normal+warheads.atomic+warheads.hydro+(warheads.bunker||0);}
function updateShots(){$('hudShots').textContent=`剩余弹药 ${totalShots()}`;}

/* ================= 瞄准 & 发射 ================= */
const BASE_CAP=135,CAP_PER_SCI=6,POWER=4.2;   // 基础力度压低：弹道极限约570px，远目标必须滑翔/二级点火
function powerCap(){
  let cap=BASE_CAP+unlockedSCI.length*CAP_PER_SCI;
  for(const sc of SCIENTISTS)if(sc.pow&&hasSCI(sc.id))cap+=sc.pow;
  return cap;
}
// 能力门控：科学家归队后常驻；在其解锁关当关即可用
function subAvail(){return hasSCI('sub')||lvIdx>=13;}
function stage2Avail(){return hasSCI('stage2')||lvIdx>=11;}
function enrichAvail(){return hasSCI('enrich')||lvIdx>=1;}
function cvPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('mousedown',e=>{
  if(state!=='play')return;
  if(demo){demo=null;toast('轮到你了！');return;}   // 点击跳过演示
  if(deployMode){tryDeploy(cvPos(e));return;}     // 部署模式：点击架设核装置
  if(missile){tryGlide();return;}
  if(totalShots()<=0)return;
  aiming=true;aimStart=cvPos(e);aimPt=aimStart;
});
cv.addEventListener('mousemove',e=>{if(aiming)aimPt=cvPos(e);});
window.addEventListener('mouseup',()=>{
  if(!aiming)return;aiming=false;
  const v=aimVec();if(!v)return;
  fire(v);
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(state==='play'&&missile)tryGlide();}
});
// 相对拖拽：在任意位置按下，拉出长度不受屏幕边缘限制
function curCap(){return powerCap()*(useSub?0.72:1);}   // 潜射出水初速低：力度-28%
function pullVec(){
  if(!aimStart||!aimPt)return null;
  let dx=aimPt.x-aimStart.x,dy=aimPt.y-aimStart.y;
  const len=Math.hypot(dx,dy),cap=curCap();
  if(len>cap){dx*=cap/len;dy*=cap/len;}
  return {dx,dy};
}
function aimVec(){
  const p=pullVec();if(!p)return null;
  if(useSub?Math.abs(p.dx)<10:-p.dx<10)return null;   // 陆基只能向右打；潜射阵地可双向
  return {vx:-p.dx*POWER,vy:-p.dy*POWER,power:Math.hypot(p.dx,p.dy)/curCap()};
}
function launchPos(){return useSub?SUB:LAUNCH;}
function fire(v){
  autoSelectWarhead();
  if((warheads[selWarhead]||0)<=0)return;
  warheads[selWarhead]--;
  firedType=selWarhead;
  const C=launchPos();
  missile={x:C.x,y:C.y,vx:v.vx,vy:v.vy,type:selWarhead,trail:[],pen:0};
  glideUsed=false;glideT=0;stage2Used=false;destroyedThisShot=0;flightT=0;
  renderWarheads();updateShots();
}
function tryGlide(){
  if(!missile||missile.vx<=0)return;
  if(!glideUsed){
    if(!hasSCI('qian'))return;
    glideUsed=true;glideT=1.5;
    missile.vy*=0.15;missile.vx=missile.vx*1.25+130;
    toast('钱学森弹道发动：进入滑翔段！');
    spawn(missile.x,missile.y,10,'#8be0ff');
    return;
  }
  if(stage2Avail()&&!stage2Used){             // 二级点火：滑翔段中再按空格
    stage2Used=true;
    missile.vx=missile.vx*1.3+120;
    missile.vy=Math.min(missile.vy,0)-170;
    toast('二级点火！发动机再次启动！');
    spawn(missile.x,missile.y,14,'#ffb366');
  }
}

/* ================= 爆炸 ================= */
function explode(x,y,type){
  const info=WARHEAD_INFO[type];
  const R=(enrichAvail()&&type!=='normal'&&type!=='bunker')?info.r*1.3:info.r; // 铀浓缩：核爆半径+30%
  shakeM=type==='hydro'?16:(type==='deploy'?12:(type==='atomic'?9:4));shakeT=type==='hydro'?0.7:0.35;
  for(const b of blocks){
    const cx=Math.max(b.x,Math.min(x,b.x+b.w)),cy=Math.max(b.y,Math.min(y,b.y+b.h));
    const d=Math.hypot(cx-x,cy-y);
    if(d<R){
      b.hp-=(d<R*0.55?info.dmg:1);
      if(b.hp<=0){spawn(b.x+b.w/2,b.y+b.h/2,14,b.type==='core'?'#ff6b6b':'#b0a08a');
        if(b.type==='core'){destroyedThisShot++;if(endless)score++;}}
    }
  }
  blocks=blocks.filter(b=>b.hp>0);
  spawn(x,y,type==='hydro'?60:(type==='deploy'?44:(type==='atomic'?36:20)),info.color);
  if(type==='hydro'||type==='deploy')spawn(x,y,40,'#ffffff');
  // 殉爆：爆炸波及已部署的核装置，连锁起爆
  const chained=devices.filter(d=>Math.hypot(d.x-x,d.y-y)<R+15);
  if(chained.length){
    devices=devices.filter(d=>!chained.includes(d));
    chained.forEach((d,i)=>setTimeout(()=>{if(state==='play'){explode(d.x,d.y,'deploy');checkEnd();}},180+i*140));
    renderWarheads();
  }
}
function spawn(x,y,n,color){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*220;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.5+Math.random()*.6,color,r:2+Math.random()*4});}
}

/* ================= 主循环 ================= */
let last=0;
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000||0.016);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
/* 第一关演示：从画面中央按住 → 向左下拖 → 松开发射（不消耗弹药、不造成伤害） */
const DEMO_PULL={sx:430,sy:250,dx:-100,dy:92};
/* 简易物理：失去支撑的掩体自然下落 */
function blockSupported(b){
  if(b.y+b.h>=GROUND-0.5)return true;
  return blocks.some(o=>o!==b&&Math.abs(o.y-(b.y+b.h))<=3&&b.x<o.x+o.w&&b.x+b.w>o.x);
}
function settleBlocks(dt){
  blocks.sort((a,b)=>(b.y+b.h)-(a.y+a.h));       // 自下而上结算
  for(const b of blocks){
    if(blockSupported(b)){b.vy=0;continue;}
    b.vy=(b.vy||0)+G*dt;
    b.y+=b.vy*dt;
    if(b.y+b.h>=GROUND){b.y=GROUND-b.h;b.vy=0;spawn(b.x+b.w/2,GROUND,5,'#b0a08a');}
    else{
      const o=blocks.find(o=>o!==b&&o.y>=b.y+b.h&&b.x<o.x+o.w&&b.x+b.w>o.x);
      if(o&&b.y+b.h>=o.y){b.y=o.y-b.h;b.vy=0;spawn(b.x+b.w/2,b.y+b.h,5,'#b0a08a');}
    }
  }
}
function update(dt){
  // 粒子
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=G*0.6*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
  if(shakeT>0)shakeT-=dt;
  settleBlocks(dt);

  // 演示流程
  if(demo){
    demo.t+=dt;
    if(!demo.flying&&demo.t>=1.9){          // 松手时刻
      demo.flying=true;
      demo.x=LAUNCH.x;demo.y=LAUNCH.y;
      demo.vx=-DEMO_PULL.dx*POWER;demo.vy=-DEMO_PULL.dy*POWER;
    }
    if(demo.flying){
      demo.vy+=G*dt;demo.x+=demo.vx*dt;demo.y+=demo.vy*dt;
      demo.trail.push({x:demo.x,y:demo.y});if(demo.trail.length>40)demo.trail.shift();
      if(demo.y>=GROUND){spawn(demo.x,GROUND,20,'#d8d8d8');demo=null;toast('轮到你了！');}
    }
    if(demo&&demo.t>8)demo=null;            // 兜底
    return;
  }

  if(missile){
    const m=missile;flightT+=dt;
    const g=(glideT>0)?G*0.14:G;
    if(glideT>0)glideT-=dt;
    m.vx+=lv.wind*dt;m.vy+=g*dt;
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    m.trail.push({x:m.x,y:m.y});if(m.trail.length>40)m.trail.shift();
    // 轨道窗口（第6关）
    if(lv.orbit&&Math.hypot(m.x-lv.orbit.x,m.y-lv.orbit.y)<lv.orbit.r){winOrbit();return;}
    // 撞掩体
    let hit=null;
    for(const b of blocks){
      if(m.x>b.x-4&&m.x<b.x+b.w+4&&m.y>b.y-4&&m.y<b.y+b.h+4){hit=b;break;}
    }
    if(hit&&m.type==='bunker'&&m.pen<2){
      // 钻地弹：贯穿掩体（最多2个），减速后继续飞行
      spawn(hit.x+hit.w/2,hit.y+hit.h/2,12,hit.type==='core'?'#ff6b6b':'#b0a08a');
      if(hit.type==='core'){destroyedThisShot++;if(endless)score++;}
      blocks=blocks.filter(b=>b!==hit);
      m.pen++;m.vx*=0.82;m.vy*=0.82;
      spawn(m.x,m.y,6,'#c9a86a');
    }else if(hit||m.y>=GROUND){explode(m.x,Math.min(m.y,GROUND),m.type);endShot();return;}
    if(m.x>W+60||m.x<-60||m.y>H+80||flightT>14)endShot();
  }
}
function endShot(){
  missile=null;
  if(destroyedThisShot===0&&hasSCI('guo')&&!shieldUsed&&!lv.orbit){
    shieldUsed=true;warheads[firedType]++; // 数据护盾：返还本次弹种
    toast('数据护盾发动：郭永怀护住了本次数据，弹药返还！');
    renderWarheads();updateShots();
  }
  checkEnd();
}
function checkEnd(){
  if(state!=='play')return;
  if(endless){
    if(coresLeft()===0){waveClear();return;}
    if(!missile&&totalShots()<=0&&devices.length===0&&(warheads.deploy||0)<=0){
      const w=wave;setTimeout(()=>{if(endless&&wave===w&&state==='play')endlessOver()},600);  // 防与清波判定的竞态
    }
    return;
  }
  if(coresLeft()===0&&!lv.orbit){setTimeout(winLevel,500);return;}
  if(!missile&&totalShots()<=0&&devices.length===0&&(warheads.deploy||0)<=0){
    const li=lvIdx;setTimeout(()=>{if(lvIdx===li&&state==='play')loseLevel()},600);
  }
}
function coresLeft(){return blocks.filter(b=>b.type==='core').length;}

/* ================= 无尽挑战 ================= */
function startEndless(){
  $('menu').classList.add('hidden');hideModal();
  endless=true;wave=0;score=0;
  lvIdx=LEVELS.length;                          // 超出主线：全部能力可用
  lv={year:'∞',name:'无尽挑战',wind:0,orbit:null,blocks:[],warheads:{}};
  state='play';
  blocks=[];particles=[];missile=null;aiming=false;
  warheads={normal:5,atomic:1,hydro:0,bunker:1,deploy:0};selWarhead='normal';
  deployMode=false;devices=[];
  glideUsed=false;glideT=0;shieldUsed=false;stage2Used=false;destroyedThisShot=0;
  demo=null;useSub=false;rewardText='';
  $('btnSite').classList.remove('hidden');
  $('btnSite').textContent='阵地：陆基';
  genWave();
  renderWarheads();updateShots();
  toast('无尽挑战：尽可能多地摧毁核心，弹药耗尽即结束！');
}
function genWave(){
  wave++;
  lv.wind=Math.round((Math.random()*2-1)*22);
  $('hudLevel').textContent=`∞ 无尽挑战 · 第${wave}波 · 得分${score}`;
  $('hudWind').textContent=lv.wind?`风沙 ${lv.wind>0?'→':'←'} ${Math.abs(lv.wind)>14?'大':'小'}`:'';
  blocks=[];
  const nCore=2+Math.min(wave,4);
  let tries=0;
  const clearOfSub=(bx,fw)=>bx+fw<=SUB.x-56||bx>=SUB.x+56;   // 给艇身留出位置，但目标可以环绕四周
  while(blocks.filter(b=>b.type==='core').length<nCore&&tries++<60){
    const bx=480+Math.floor(Math.random()*10)*48;            // 480~912
    const kind=Math.random();
    if(kind<0.3){          // 单柱塔
      if(!clearOfSub(bx,48))continue;
      const sup=Math.random()<0.5?'steel':'concrete';
      blocks.push({x:bx,y:GROUND-40,w:48,h:40,type:sup,hp:sup==='steel'?2:1});
      blocks.push({x:bx+4,y:GROUND-80,w:40,h:40,type:'core',hp:1});
    }else if(kind<0.55){   // 三层高塔
      if(!clearOfSub(bx,40))continue;
      blocks.push({x:bx,y:GROUND-40,w:40,h:40,type:'concrete',hp:1});
      blocks.push({x:bx,y:GROUND-80,w:40,h:40,type:'steel',hp:2});
      blocks.push({x:bx,y:GROUND-120,w:40,h:40,type:'core',hp:1});
    }else if(kind<0.8){    // 碉堡：双钢壁后藏核心
      if(!clearOfSub(bx,94))continue;
      blocks.push({x:bx,y:GROUND-40,w:22,h:40,type:'steel',hp:2});
      blocks.push({x:bx+22,y:GROUND-40,w:22,h:40,type:'steel',hp:2});
      blocks.push({x:bx+54,y:GROUND-40,w:40,h:40,type:'core',hp:1});
    }else{                 // 金字塔
      if(!clearOfSub(bx,100))continue;
      blocks.push({x:bx,y:GROUND-40,w:100,h:40,type:'concrete',hp:1});
      blocks.push({x:bx+30,y:GROUND-80,w:40,h:40,type:'steel',hp:2});
      blocks.push({x:bx+30,y:GROUND-120,w:40,h:40,type:'core',hp:1});
    }
  }
  const walls=Math.min(wave,3);                              // 随机护甲墙
  for(let i=0;i<walls;i++){
    const wx=480+Math.floor(Math.random()*10)*48;
    if(!clearOfSub(wx,24))continue;
    blocks.push({x:wx,y:GROUND-120,w:24,h:120,type:'steel',hp:2});
  }
}
function waveClear(){
  warheads.normal+=3;let bonus='';
  if(wave%3===0){warheads.atomic=(warheads.atomic||0)+1;bonus+=' +1原子弹';}
  if(wave%4===0){warheads.bunker=(warheads.bunker||0)+1;bonus+=' +1钻地弹';}
  if(wave%5===0){warheads.hydro=(warheads.hydro||0)+1;bonus+=' +1氢弹';}
  toast(`第${wave}波已清除！补给 +3常规弹${bonus}`);
  genWave();renderWarheads();updateShots();
}

function tryDeploy(pt){

  if(pt.x<380||pt.x>W-20||pt.y<60||pt.y>GROUND-12){toast('核装置要部署在右侧场地区域');return;}
  warheads.deploy--;devices.push({x:pt.x,y:pt.y});
  spawn(pt.x,pt.y,8,'#ff9b4d');
  if(warheads.deploy<=0)deployMode=false;
  renderWarheads();
}
function detonateDevices(){
  if(!devices.length)return;
  const ds=devices;devices=[];deployMode=false;

}

/* ================= 绘制 ================= */
function draw(){
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-.5)*shakeM,(Math.random()-.5)*shakeM);
  // 天空
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0b1026');sky.addColorStop(.7,'#2a2350');sky.addColorStop(1,'#5a3a3a');
  ctx.fillStyle=sky;ctx.fillRect(-20,-20,W+40,H+40);
  // 星
  ctx.fillStyle='#ffffff55';
  for(let i=0;i<40;i++){ctx.fillRect((i*137)%W,(i*61)%180,2,2);}
  // 远山 / 戈壁
  ctx.fillStyle='#3a2c33';ctx.beginPath();
  ctx.moveTo(0,GROUND);ctx.quadraticCurveTo(240,400,480,GROUND);ctx.fill();
  ctx.fillStyle='#4a3630';ctx.beginPath();
  ctx.moveTo(300,GROUND);ctx.quadraticCurveTo(640,380,960,GROUND);ctx.fill();
  ctx.fillStyle='#6b4f35';ctx.fillRect(-20,GROUND,W+40,H-GROUND+20);
  ctx.fillStyle='#7d5f41';ctx.fillRect(-20,GROUND,W+40,6);

  if(state==='play'||state==='result'){
    drawLauncher();
    // 轨道窗口
    if(lv&&lv.orbit){
      const o=lv.orbit;ctx.save();
      ctx.strokeStyle='#8be0ff';ctx.setLineDash([8,6]);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.283);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle='#8be0ff22';ctx.fill();
      ctx.fillStyle='#8be0ff';ctx.font='14px sans-serif';ctx.textAlign='center';
      ctx.fillText('轨道窗口',o.x,o.y-o.r-8);ctx.restore();
    }
    // 掩体
    for(const b of blocks)drawBlock(b);
    // 潜射阵地画在掩体之上：目标可以环绕在它四周
    if(subAvail())drawSub();
    // 已部署的核装置
    for(const d of devices)drawDevice(d);
    // 预览
    if(aiming&&state==='play')drawAim();
    // 演示
    if(demo&&state==='play')drawDemo();
    // 导弹
    if(missile)drawMissile();
    // 粒子
    for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
    ctx.globalAlpha=1;
    // 提示
    if(state==='play'&&rewardText){
      ctx.fillStyle='#f0c869bb';ctx.font='bold 13px sans-serif';ctx.textAlign='right';
      ctx.fillText('★ '+rewardText+' ★',W-16,18);
    }
    if(state==='play'&&!missile&&!aiming&&!demo){
      ctx.fillStyle='#ffffff88';ctx.font='14px sans-serif';ctx.textAlign='left';
      let tip='从画面中央按住，向左下方拖拽拉弓，松开发射';
      if(hasSCI('qian'))tip+='　|　飞行中按空格 = 钱学森弹道';
      ctx.fillText(tip,20,30);
    }
    if(missile&&hasSCI('qian')&&!glideUsed){
      ctx.fillStyle='#8be0ff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText('按【空格】发动钱学森弹道！',W/2,40);
    }
    if(missile&&glideUsed&&stage2Avail()&&!stage2Used){
      ctx.fillStyle='#ffb366';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText('再按【空格】二级点火！',W/2,40);
    }
    if(deployMode){
      ctx.fillStyle='#ff9b4d';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText('部署模式：点击右侧场地架设核装置（再点一次按钮取消）',W/2,40);
    }
  }
  ctx.restore();
}
/* 演示动画绘制：按住 → 拖拽（带弹道预览） → 发射 */
function drawDemo(){
  const d=demo,D=DEMO_PULL;
  ctx.save();
  // 标题
  ctx.fillStyle='#f0c869';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
  ctx.fillText('操作演示（点击画面跳过）',W/2,70);
  if(!d.flying){
    // 阶段一：按住（0~0.7s） 阶段二：拖拽（0.7~1.9s）
    const dragT=Math.max(0,Math.min(1,(d.t-0.7)/1.2));
    const fx=D.sx+D.dx*dragT,fy=D.sy+D.dy*dragT;
    const pullDx=D.dx*dragT,pullDy=D.dy*dragT;
    // 拖拽轨迹虚线
    if(dragT>0){
      ctx.strokeStyle='#f0c869aa';ctx.setLineDash([6,6]);ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(D.sx,D.sy);ctx.lineTo(fx,fy);ctx.stroke();ctx.setLineDash([]);
      // 导轨 + 弹丸
      const px=LAUNCH.x+pullDx,py=LAUNCH.y+pullDy;
      drawRails(Math.atan2(pullDy,pullDx),Math.hypot(pullDx,pullDy)/powerCap(),true);
      ctx.fillStyle='#d8d8d8';ctx.beginPath();ctx.arc(px,py,9,0,6.283);ctx.fill();
      ctx.strokeStyle='#00000088';ctx.stroke();
      // 弹道预览
      drawPreview(-pullDx*POWER,-pullDy*POWER);
    }
    // 手指圆点
    ctx.fillStyle='#f0c869';ctx.beginPath();ctx.arc(fx,fy,10,0,6.283);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
    // 阶段文字
    ctx.fillStyle='#fff';ctx.font='15px sans-serif';
    ctx.fillText(dragT===0?'① 从画面中央按住':'② 向左下方拖拽拉弓',D.sx,D.sy-24);
  }else{
    // 演示弹飞行
    ctx.fillStyle='#fff';ctx.font='15px sans-serif';
    ctx.fillText('③ 松开发射！',W/2,100);
    ctx.strokeStyle='#ffaa5533';ctx.lineWidth=3;ctx.beginPath();
    d.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.lineWidth=1;
    const a=Math.atan2(d.vy,d.vx);
    ctx.translate(d.x,d.y);ctx.rotate(a);
    ctx.fillStyle='#d8d8d8';
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,-5);ctx.lineTo(-8,5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff8833';
    ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-14-Math.random()*6,-3);ctx.lineTo(-14-Math.random()*6,3);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawPreview(vx0,vy0){
  const C=launchPos();
  let x=C.x,y=C.y,vx=vx0,vy=vy0;
  const dt=0.05;
  ctx.fillStyle='#ffffffaa';
  for(let i=0;i<120;i++){
    vx+=lv.wind*dt;vy+=G*dt;x+=vx*dt;y+=vy*dt;
    if(y>GROUND||x>W)break;
    if(i%2===0){ctx.beginPath();ctx.arc(x,y,2.5,0,6.283);ctx.fill();}
  }
}
function drawBlock(b){
  if(b.type==='concrete')ctx.fillStyle=b.hp<1?'#6e6558':'#8d8272';
  else if(b.type==='steel')ctx.fillStyle=b.hp<2?'#5d6b7d':'#7e90a8';
  else{ctx.fillStyle='#c0392b';}
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle='#00000066';ctx.strokeRect(b.x,b.y,b.w,b.h);
  if(b.type==='core'){
    ctx.fillStyle='#ffd8d8';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
    ctx.fillText('★',b.x+b.w/2,b.y+b.h/2+6);
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;ctx.strokeRect(b.x-2,b.y-2,b.w+4,b.h+4);ctx.lineWidth=1;
  }
}
function drawDevice(d){
  // 铁塔：从地面架起
  ctx.strokeStyle='#8d8272';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(d.x-16,GROUND);ctx.lineTo(d.x,d.y);ctx.lineTo(d.x+16,GROUND);ctx.stroke();
  ctx.lineWidth=1;
  for(let y=d.y+14;y<GROUND-4;y+=14){const t=(y-d.y)/(GROUND-d.y);
    ctx.beginPath();ctx.moveTo(d.x-16*t,y);ctx.lineTo(d.x+16*t,y);ctx.stroke();}
  // 塔顶核装置（红灯闪烁）
  ctx.fillStyle=Math.sin(Date.now()/180)>0?'#ff5b4d':'#c0392b';
  ctx.beginPath();ctx.arc(d.x,d.y,10,0,6.283);ctx.fill();
  ctx.strokeStyle='#ffd27b';ctx.stroke();
}
function drawRails(ang,ratio=0,showForward=false,C=LAUNCH){
  const px=Math.cos(ang+Math.PI/2),py=Math.sin(ang+Math.PI/2); // 垂直于发射方向
  const half=24+ratio*36;                                      // 两侧虚线随力度变长
  const ax=Math.cos(ang),ay=Math.sin(ang);
  ctx.strokeStyle='#93a5cf';ctx.lineWidth=2;ctx.setLineDash([6,6]);
  // 虚线：过中心、垂直于发射方向
  ctx.beginPath();ctx.moveTo(C.x-px*half,C.y-py*half);ctx.lineTo(C.x+px*half,C.y+py*half);ctx.stroke();
  if(showForward){   // 拉开后显示：沿发射方向的虚线
    ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(C.x-ax*80,C.y-ay*80);ctx.stroke();
  }
  ctx.setLineDash([]);
  // 虚线两端各一条小杠（沿发射方向）
  const t=9;
  ctx.lineCap='round';
  for(const s of [1,-1]){
    const ex=C.x+px*half*s,ey=C.y+py*half*s;
    ctx.strokeStyle='#46536f';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ex-ax*t,ey-ay*t);ctx.lineTo(ex+ax*t,ey+ay*t);ctx.stroke();
    ctx.strokeStyle='#93a5cf';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(ex-ax*t,ey-ay*t);ctx.lineTo(ex+ax*t,ey+ay*t);ctx.stroke();
  }
  ctx.lineCap='butt';ctx.lineWidth=1;
}
function demoDragActive(){return demo&&demo.t>0.7&&!demo.flying;}
function drawLauncher(){
  ctx.fillStyle='#37415f';ctx.fillRect(LAUNCH.x-38,GROUND-14,76,14);   // 底盘
  ctx.fillStyle='#4a5578';ctx.fillRect(LAUNCH.x-5,LAUNCH.y,10,GROUND-14-LAUNCH.y); // 支柱
  if(!aiming&&!demoDragActive()&&!useSub)drawRails(RAIL.defAng);        // 导轨（静止态）
  ctx.fillStyle='#f0c869';ctx.beginPath();ctx.arc(LAUNCH.x,LAUNCH.y,7,0,6.283);ctx.fill();
  ctx.fillStyle='#9aa3c7';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('发射阵地',LAUNCH.x,GROUND+26);
}
function drawSub(){
  const S=SUB;
  ctx.fillStyle='#2e4a5e';                                             // 艇身
  ctx.beginPath();ctx.ellipse(S.x,S.y+14,46,12,0,0,6.283);ctx.fill();
  ctx.fillStyle='#3d5f78';ctx.fillRect(S.x-10,S.y-4,20,12);            // 指挥塔
  ctx.fillStyle='#7ec8e355';ctx.fillRect(S.x-54,S.y+24,108,3);         // 水线
  if(!aiming&&!demoDragActive()&&useSub)drawRails(RAIL.defAng,0,false,S);
  ctx.fillStyle='#f0c869';ctx.beginPath();ctx.arc(S.x,S.y,6,0,6.283);ctx.fill();
  ctx.fillStyle='#9aa3c7';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('潜射阵地',S.x,GROUND+26);
}
function drawAim(){
  const v=aimVec(),pv=pullVec();if(!v||!pv)return;
  const C=launchPos();
  const px=C.x+pv.dx,py=C.y+pv.dy;
  const pl=Math.hypot(pv.dx,pv.dy)||1,ux=pv.dx/pl,uy=pv.dy/pl;
  drawRails(Math.atan2(pv.dy,pv.dx),v.power,true,C);   // 准星旋转对准拉线方向，随力度展开
  // 圆圈（弹丸）：被拉离中心，内嵌指向发射方向的小箭头
  ctx.fillStyle=WARHEAD_INFO[selWarhead].color;
  ctx.beginPath();ctx.arc(px,py,9,0,6.283);ctx.fill();
  ctx.strokeStyle='#00000088';ctx.stroke();
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(px+ux*4,py+uy*4);ctx.lineTo(px-ux*5,py-uy*5);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();
  ctx.moveTo(px-ux*10,py-uy*10);
  ctx.lineTo(px-ux*4-uy*3.4,py-uy*4+ux*3.4);
  ctx.lineTo(px-ux*4+uy*3.4,py-uy*4-ux*3.4);
  ctx.closePath();ctx.fill();ctx.lineWidth=1;
  // 力度条
  ctx.fillStyle='#00000088';ctx.fillRect(C.x-60,C.y+36,120,10);
  ctx.fillStyle=v.power>0.85?'#ff6b6b':'#f0c869';
  ctx.fillRect(C.x-58,C.y+38,116*v.power,6);
  ctx.strokeStyle='#888';ctx.strokeRect(C.x-60,C.y+36,120,10);
  ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('力度 '+Math.round(v.power*100)+'%',C.x,C.y+60);
  // 弹道预览：瞄准镜（孙家栋归队后解锁）
  if(hasSCI('sun'))drawPreview(v.vx,v.vy);
}
function drawMissile(){
  const m=missile;
  // 尾迹
  ctx.strokeStyle=glideT>0?'#8be0ff88':'#ffaa5533';ctx.lineWidth=3;ctx.beginPath();
  m.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.lineWidth=1;
  // 弹体
  const a=Math.atan2(m.vy,m.vx);
  ctx.save();ctx.translate(m.x,m.y);ctx.rotate(a);
  ctx.fillStyle=WARHEAD_INFO[m.type].color;
  ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,-5);ctx.lineTo(-8,5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff8833';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-14-Math.random()*6,-3);ctx.lineTo(-14-Math.random()*6,3);ctx.closePath();ctx.fill();
  ctx.restore();
}
